$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: GET
pathVariables:
  id: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |-
      const qa_workshop_package = pm.require('@postvehicle-enterprise-team-9b60a507-5485-4313-b7b6-e2d07964/qa_workshop_package');
      pm.test("VIN is a validly-formatted string", function () {
           var jsonData = pm.response.json();
          console.log("Checking VIN: " + jsonData.vehicle.vin + " ...");
          pm.expect(jsonData.vehicle.vin).to.be.a.string;
          pm.expect(qa_workshop_package.isValidVIN(jsonData.vehicle.vin)).to.be.true;

      });
    language: text/javascript
    packages:
      "@postvehicle-enterprise-team-9b60a507-5485-4313-b7b6-e2d07964/qa_workshop_package":
        id: 019e928f-8303-7626-84de-a61fff2ca6cd
order: 2000
